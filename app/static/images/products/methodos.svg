<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="760" height="160">
  <!--
    Methodos logo — animated wordmark v3
    English: "method" + "/" + "os"
      · "method" non-bold, Navy (#1A2433)
      · "/os" bold, Coral (#F0643A)
      · manual flat macron bar centered over the 'e'
    Greek:   "μέθοδ" + "ος"
      · font's natural tonos accent on ε
      · "μέθοδ" non-bold Navy, "ος" bold Coral
      · no slash — typographic color split does the separation
    Animation: 13.5s loop (each state held ~4.5s, cross-fades ~1.5s)
      · English holds 0-33%
      · crossfade English→Greek 33-44% (English drifts up, Greek settles down)
      · Greek holds 44-89%
      · crossfade Greek→English 89-100%
  -->

  <!-- ═══════════════════════════════════════════════
       ENGLISH — method/os
  ═══════════════════════════════════════════════ -->
  <g id="english">
    <text
      font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-size="110"
      letter-spacing="-1"
      text-anchor="middle"
      x="380" y="128">
      <tspan fill="#1A2433" font-weight="400">method</tspan><tspan fill="#F0643A" font-weight="700">/os</tspan>
    </text>

    <!-- Manual flat macron bar over the 'e' — position depends on rendered font.
         Wordmark is now text-anchor="middle" x=380, so the visible width of
         "method/os" varies by font (Inter on design machine, system-ui/
         -apple-system/Helvetica/Arial in browser fallbacks). 'e' lands at
         roughly SVG x=194.5 in Helvetica fallback (measured in headless
         Firefox screenshot 2026-06-30). Position x1=185 x2=220 puts the
         macron over the 'e' with Quinn's prior +8 rightward aesthetic
         bias (originally x1=135→143, x2=170→178 in pre-centering layout).
         Re-measure if the rendered font changes. -->
    <line x1="185" y1="55" x2="220" y2="55" stroke="#1A2433" stroke-width="7" stroke-linecap="round"/>

    <animate
      attributeName="opacity"
      values="1; 1; 0; 0; 1"
      keyTimes="0; 0.33; 0.44; 0.89; 1"
      dur="13.5s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 0; 0 -8; 0 -8; 0 0"
      keyTimes="0; 0.33; 0.44; 0.89; 1"
      dur="13.5s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
      additive="sum"/>
  </g>

  <!-- ═══════════════════════════════════════════════
       GREEK — μέθοδος
  ═══════════════════════════════════════════════ -->
  <g id="greek" opacity="0">
    <text
      font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-size="110"
      letter-spacing="-1"
      text-anchor="middle"
      x="380" y="128">
      <tspan fill="#1A2433" font-weight="400">μέθοδ</tspan><tspan fill="#F0643A" font-weight="700">ος</tspan>
    </text>

    <animate
      attributeName="opacity"
      values="0; 0; 1; 1; 0"
      keyTimes="0; 0.33; 0.44; 0.89; 1"
      dur="13.5s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 8; 0 8; 0 0; 0 0; 0 8"
      keyTimes="0; 0.33; 0.44; 0.89; 1"
      dur="13.5s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
      additive="sum"/>
  </g>

</svg>
