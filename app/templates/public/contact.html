{% extends 'base.html' %}

{% block title %}Contact — Psi Function{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/contact.css') }}">
{% endblock %}

{% block content %}

<section class="contact-page">

  <!-- EYEBROW: full-width, above the two-column grid -->
  <p class="contact__eyebrow">Contact Psi Function</p>

  <div class="container section-stack">
    <div class="contact-grid">

      <div class="card contact-grid__span-3 contact-grid__media-card">
        <img
          src="{{ url_for('static', filename='images/canvas_wave.png') }}"
          alt=""
          aria-hidden="true"
          class="contact-grid__img"
        >
      </div>

      <a
        class="card contact-grid__span-1 contact-card contact-card--email"
        href="mailto:info@psifunction.com?subject=Inquiry%20from%20psifunction.com"
        aria-label="Send an email to Psi Function"
      >
        <svg class="contact-card__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M2 7l10 7 10-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="card__title">Email</span>
        <span class="contact-card__hint card__text">info@psifunction.com</span>
      </a>

      <a
        class="card contact-grid__span-1 contact-card contact-card--linkedin"
        href="https://www.linkedin.com/company/psi-function-llc/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit Psi Function on LinkedIn (opens in new tab)"
      >
        <svg class="contact-card__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M7 10v7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="7" cy="7" r="1" fill="currentColor"/>
          <path d="M11 10v7m0-4c0-2 1.5-3 3-3s3 1 3 3v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="card__title">LinkedIn</span>
        <span class="contact-card__hint card__text">Psi Function LLC</span>
      </a>

    </div>
  </div>
</section>


{% endblock %}
