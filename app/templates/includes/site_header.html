<header class="site-header">
  <div class="site-header__inner container">

    <!-- MOBILE: hamburger toggle (top-left, hidden on desktop) -->
    <button
      class="hamburger-toggle"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
      id="hamburger-btn"
    >
      <span class="hamburger-toggle__bar"></span>
      <span class="hamburger-toggle__bar"></span>
      <span class="hamburger-toggle__bar"></span>
    </button>

    <!-- MOBILE: slide-out menu panel -->
    <div class="mobile-menu" id="mobile-menu" hidden>
      <a class="mobile-menu__link" href="/home">Home</a>
      <a class="mobile-menu__link" href="/services">Services</a>
      <a class="mobile-menu__link" href="/products">Products</a>
      <a class="mobile-menu__link" href="/p/login">Portal</a>
      <a class="mobile-menu__link" href="/about">About</a>
      <a class="mobile-menu__link" href="/contact">Contact Us</a>

      <div class="mobile-menu__divider"></div>

      <div class="mobile-menu__theme-group">
        <span class="mobile-menu__theme-label">Theme</span>
        <div class="mobile-menu__theme-strip" role="radiogroup" aria-label="Theme">
          <button class="mobile-menu__theme-icon" data-theme-value="auto" role="radio" aria-checked="false" title="Auto" aria-label="Set theme to Auto">
            {{ theme_icon('auto') }}
          </button>
          <button class="mobile-menu__theme-icon" data-theme-value="day" role="radio" aria-checked="false" title="Day" aria-label="Set theme to Day">
            {{ theme_icon('day') }}
          </button>
          <button class="mobile-menu__theme-icon" data-theme-value="twilight" role="radio" aria-checked="false" title="Twilight" aria-label="Set theme to Twilight">
            {{ theme_icon('twilight') }}
          </button>
          <button class="mobile-menu__theme-icon" data-theme-value="night" role="radio" aria-checked="false" title="Night" aria-label="Set theme to Night">
            {{ theme_icon('night') }}
          </button>
        </div>
        <span class="mobile-menu__theme-caption" id="mobile-theme-caption" aria-live="polite">Auto</span>
      </div>
    </div>

    <!-- LEFT: logo circle -->

    <a class="site-logo {% if request.endpoint == 'public.home' %}site-logo--hidden{% endif %}" href="/home">
      <img
        src="{{ url_for('static', filename='images/psi_logo_3.webp') }}"
        alt="Psi Function logo"
        class="site-logo__img"
      >
    </a>

    <!-- CENTER: nav pill (desktop only) -->
    <nav class="site-nav" aria-label="Main navigation">
      <a class="site-nav__link" href="/home">Home</a>
      <a class="site-nav__link" href="/services">Services</a>
      <a class="site-nav__link" href="/products">Products</a>
      <a class="site-nav__link" href="/p/login">Portal</a>
      <a class="site-nav__link" href="/about">About</a>

      <!--
        Theme switcher — an icon-circle button (replaces the text "Theme" link).
        The popup is positioned relative to this wrapper.
        The visible icon is the active theme; click to open the chooser.
      -->
      <div class="site-nav__theme-wrapper">
        <button
          class="site-nav__theme-toggle"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="theme-popup"
          aria-label="Theme"
          title="Theme"
          id="theme-toggle-btn"
          data-theme-value=""
        ><span class="site-nav__theme-icon" id="theme-active-icon" aria-hidden="true">
          {{ theme_icon('auto') }}
        </span></button>

        <div
          class="theme-popup"
          id="theme-popup"
          role="menu"
          aria-labelledby="theme-toggle-btn"
          hidden
        >
          <button class="theme-popup__option" role="menuitem" data-theme-value="auto" title="Auto" aria-label="Set theme to Auto">
            <span class="theme-popup__icon" aria-hidden="true">{{ theme_icon('auto') }}</span>
          </button>
          <button class="theme-popup__option" role="menuitem" data-theme-value="day" title="Day" aria-label="Set theme to Day">
            <span class="theme-popup__icon" aria-hidden="true">{{ theme_icon('day') }}</span>
          </button>
          <button class="theme-popup__option" role="menuitem" data-theme-value="twilight" title="Twilight" aria-label="Set theme to Twilight">
            <span class="theme-popup__icon" aria-hidden="true">{{ theme_icon('twilight') }}</span>
          </button>
          <button class="theme-popup__option" role="menuitem" data-theme-value="night" title="Night" aria-label="Set theme to Night">
            <span class="theme-popup__icon" aria-hidden="true">{{ theme_icon('night') }}</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- RIGHT: Contact Us pill -->
    <div class="site-header__controls">
      <a class="contact-pill" href="/contact">Contact Us</a>
    </div>

  </div>
</header>
