<header class="site-header">
  <div class="site-header__inner container">

    <!-- MOBILE: hamburger toggle (top-left, hidden on desktop) -->
    <button
      class="hamburger-toggle"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
      id="hamburger-btn"
    >
      <span class="hamburger-toggle__bar"></span>
      <span class="hamburger-toggle__bar"></span>
      <span class="hamburger-toggle__bar"></span>
    </button>

    <!-- MOBILE: slide-out menu panel -->
    <div class="mobile-menu" id="mobile-menu" hidden>
      <a class="mobile-menu__link" href="/home">Home</a>
      <a class="mobile-menu__link" href="/services">Services</a>
      <a class="mobile-menu__link" href="/products">Products</a>
      <a class="mobile-menu__link" href="/p/login">Portal</a>
      <a class="mobile-menu__link" href="/about">About</a>
      <a class="mobile-menu__link" href="/contact">Contact Us</a>

      <div class="mobile-menu__divider"></div>

      <div class="mobile-menu__theme-group">
        <span class="mobile-menu__theme-label">Theme</span>
        <button class="mobile-menu__theme-option" data-theme-value="auto">Auto</button>
        <button class="mobile-menu__theme-option" data-theme-value="day">Day</button>
        <button class="mobile-menu__theme-option" data-theme-value="twilight">Twilight</button>
        <button class="mobile-menu__theme-option" data-theme-value="night">Night</button>
      </div>
    </div>

    <!-- LEFT: logo circle -->

    <a class="site-logo {% if request.endpoint == 'public.home' %}site-logo--hidden{% endif %}" href="/home">
      <img
        src="{{ url_for('static', filename='images/psi_logo_3.webp') }}"
        alt="Psi Function logo"
        class="site-logo__img"
      >
    </a>

    <!-- CENTER: nav pill (desktop only) -->
    <nav class="site-nav" aria-label="Main navigation">
      <a class="site-nav__link" href="/home">Home</a>
      <a class="site-nav__link" href="/services">Services</a>
      <a class="site-nav__link" href="/products">Products</a>
      <a class="site-nav__link" href="/p/login">Portal</a>
      <a class="site-nav__link" href="/about">About</a>

      <!--
        Theme toggle — a button that looks like a nav link.
        The popup is positioned relative to this wrapper.
      -->
      <div class="site-nav__theme-wrapper">
        <button
          class="site-nav__link site-nav__theme-toggle"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="theme-popup"
          id="theme-toggle-btn"
        >Theme</button>

        <div
          class="theme-popup"
          id="theme-popup"
          role="menu"
          aria-labelledby="theme-toggle-btn"
          hidden
        >
          <button class="theme-popup__option" role="menuitem" data-theme-value="auto">
            <span class="theme-popup__check" aria-hidden="true">✓</span>
            <span class="theme-popup__label">Auto</span>
      <!--
            <span class="theme-popup__hint">Follows time of day</span>
      -->
          </button>
          <button class="theme-popup__option" role="menuitem" data-theme-value="day">
            <span class="theme-popup__check" aria-hidden="true">✓</span>
            <span class="theme-popup__label">Day</span>
          </button>
          <button class="theme-popup__option" role="menuitem" data-theme-value="twilight">
            <span class="theme-popup__check" aria-hidden="true">✓</span>
            <span class="theme-popup__label">Twilight</span>
          </button>
          <button class="theme-popup__option" role="menuitem" data-theme-value="night">
            <span class="theme-popup__check" aria-hidden="true">✓</span>
            <span class="theme-popup__label">Night</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- RIGHT: Contact Us pill -->
    <div class="site-header__controls">
      <a class="contact-pill" href="/contact">Contact Us</a>
    </div>

  </div>
</header>
