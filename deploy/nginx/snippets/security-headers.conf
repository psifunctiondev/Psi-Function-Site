# Security headers - conservative set

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP for the Psi Function site. Slice 9 changes:
#   - script-src kept at 'self' (inline JS extracted into
#     app/static/js/portal/competitive-audit-form.js).
#   - img-src: Squarespace CDN hosts the client banner images
#     (static1.squarespace.com / images.squarespace-cdn.com).
#   - script-src: Cloudflare Web Analytics beacon loads from
#     static.cloudflareinsights.com.
#   - connect-src: same Cloudflare beacon endpoint needs beacon
#     sends allowed.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: https://static1.squarespace.com https://images.squarespace-cdn.com; style-src 'self' 'unsafe-inline' https:; script-src 'self' https://static.cloudflareinsights.com; font-src 'self' https: data:; connect-src 'self' https://static.cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;